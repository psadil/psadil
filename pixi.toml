#:schema https://pixi.sh/v0.73.0/schema/manifest/schema.json

[workspace]
authors = [ "Patrick Sadil <psadil@gmail.com>" ]
channels = [ "conda-forge" ]
name = "psadil"
platforms = [ "osx-arm64" ]
version = "0.1.0"

[tasks]
preview = "quarto preview"
publish = "quarto publish gh-pages"
render = "quarto render index.qmd"
render-posts = "bash scripts/render-posts.sh"

# re-execute every post in its own environment, then build the site
[tasks.render-all]
cmd = "quarto render"
depends-on = [ "render-posts" ]

[dependencies]
quarto = ">=1.7.32,<2"
